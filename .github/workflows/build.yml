name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Temporary: find which macOS runner images this repository can actually get.
  probe:
    name: Probe ${{ matrix.image }}
    runs-on: ${{ matrix.image }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        image: [macos-latest, macos-15, macos-14, macos-13]
    steps:
      - run: uname -m && sw_vers

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: relay-windows-x86_64
            binary: relay.exe
          - name: macOS arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
            artifact: relay-macos-arm64
            binary: relay

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --locked -p relay-desktop \
            --target ${{ matrix.target }} 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Build failed: ${{ matrix.target }}"
              echo '```'
              grep -nE '^error|^\s+-->|error\[E[0-9]+\]' build.log | head -30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E '^error' -A2 build.log | head -40 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit "$status"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14
