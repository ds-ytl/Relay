[package]
name = "relay-desktop"
description = "Relay · GPUI desktop shell, global shortcut and management center"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "relay"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:gpui-kit"]

[dependencies]
relay-core.workspace = true
relay-storage.workspace = true
relay-context.workspace = true
relay-platform.workspace = true
relay-router.workspace = true
relay-openai.workspace = true
relay-executor.workspace = true
relay-runtime.workspace = true
relay-sandbox.workspace = true
relay-delivery.workspace = true
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
uuid.workspace = true
open.workspace = true
image.workspace = true
gpui-kit = { version = "0.10.0", optional = true, features = ["speech"] }

[dev-dependencies]
tempfile.workspace = true
