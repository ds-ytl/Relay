[package]
name = "relay-accessibility-tool"
description = "Relay · computer_accessibility: inspect and operate desktop UI semantically (macOS AX / Windows UIA / Linux AT-SPI)"
version.workspace = true
edition = "2024"
license.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
relay-tool-api.workspace = true
# Platform accessibility client; xa11y picks the backend for the target platform.
xa11y = { version = "0.15", default-features = false }

[dev-dependencies]
# test-support provides an in-memory xa11y provider, so operations can be tested without a real desktop or permissions.
xa11y = { version = "0.15", default-features = false, features = ["test-support"] }
